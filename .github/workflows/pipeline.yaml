name: CI Pipeline
on: 
  push:
   branches: [main]

jobs: 
  build:
    runs-on: ubuntu-latest

steps: 
  - name: checkout code
    uses: actions/checkout@v5
  - name: Set up Node.js
    uses: actions/setuo-node@v3
    with:
      node-version: '18'
  - name: Install dependencies
    run: npm install

  - name: Run Tests
    run: npm test      
